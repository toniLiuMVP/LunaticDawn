# ============================================================
#  DOSBox-X 設定檔 · 俠客遊 II (Lunatic Dawn II, 1996)
#  可攜版：沒有任何硬編路徑
#  由吟遊詩人的傳說 · 俠客遊小站 於 2026 整理
#  https://toniliumvp.github.io/LunaticDawn/
#
#  使用方式：
#    1. 把這個檔案放在和 LUNA2.EXE 同一個資料夾
#    2. 雙擊啟動腳本（Mac: Mac_Play_Luna2.command / Win: Win_Play_Luna2.bat
#       / Linux: Linux_Play_Luna2.sh）
#    3. 啟動腳本會自動把遊戲資料夾 mount 成 C:
#
#  手動模式（進階使用者）：
#    dosbox-x -conf dosbox-x.conf -c "mount c ." -c "c:" -c "LUNA2.EXE"
# ============================================================

[sdl]
fullscreen       = false
fulldouble       = false
fullresolution   = desktop
windowresolution = 960x720
output           = openglpp
autolock         = true
sensitivity      = 100
waitonerror      = true
priority         = higher,normal
usescancodes     = true

[dosbox]
title            = 俠客遊 II (Lunatic Dawn II)
memsize          = 4
machine          = svga_s3
captures         = capture
language         =

[video]
vmemsize         = 4

[render]
aspect           = true
scaler           = none

[cpu]
core             = auto
cputype          = pentium
# 1996 年的遊戲大約設計在 Pentium 100 左右
# fixed 50000 ≈ Pentium 100；若太慢：Ctrl+F12 加速；太快：Ctrl+F11 減速
cycles           = fixed 50000
cycleup          = 500
cycledown        = 500

[mixer]
nosound          = false
rate             = 44100
blocksize        = 1024
prebuffer        = 25

[sblaster]
sbtype           = sb16
sbbase           = 220
irq              = 7
dma              = 1
hdma             = 5
mixer            = true
oplmode          = auto
oplrate          = 44100
oplemu           = default

[midi]
mpu401           = intelligent
mididevice       = default

[speaker]
pcspeaker        = true
tandy            = auto
disney           = false

[joystick]
joysticktype     = none

[dos]
xms              = true
ems              = true
umb              = true
ver              = 6.22
keyboardlayout   = us

[ipx]
ipx              = false

# ============================================================
#  音效模式：本設定檔預設不載入任何音效驅動。
#  SNDSET.CFG 選 Adlib/OPL 時，由 DOSBox 內建 FM 合成直接出聲；
#  要用 GM MIDI，請照下方 [autoexec] 的說明載入 MIDPAK / SB16 驅動。
#  如果沒有聲音，請在遊戲資料夾執行 SNDSET.EXE 重新設定。
# ============================================================
#
# ============================================================
#  [autoexec] 只負責顯示啟動橫幅（只用 ASCII，DOS 畫面不會變亂碼）
#  真正的 mount c . / c: / LUNA2.EXE 由啟動腳本用 -c 注入
#  （這樣此 conf 檔完全不用知道遊戲在哪個路徑）
#
#  要用 GM MIDI 音樂：[autoexec] 比啟動腳本加上的指令更早執行，
#  所以要在最後面自己先 mount 再載入驅動，例如：
#    mount c .
#    c:
#    LH MIDPAK.COM
#    LH M\SB16.COM
#  之後啟動腳本會再 mount 一次並執行 LUNA2.EXE。
# ============================================================
[autoexec]
@echo off
cls
echo ============================================================
echo    Lunatic Dawn II   (1996 Artdink)
echo    Launcher: toniliumvp.github.io/LunaticDawn
echo ------------------------------------------------------------
echo    Alt+Enter = fullscreen / window
echo    Ctrl+F11 / Ctrl+F12 = slower / faster CPU
echo    Ctrl+F9 = quit emulator
echo ============================================================
echo.
